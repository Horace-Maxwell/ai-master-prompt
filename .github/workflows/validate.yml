name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      links:
        description: "Also check that every resource URL still responds"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate data
        run: python3 scripts/build.py --check
      - name: Generated files are up to date
        run: |
          python3 scripts/build.py --fmt
          python3 scripts/build.py
          git diff --exit-code || {
            echo "::error::Generated files are stale. Run 'python3 scripts/build.py --fmt && python3 scripts/build.py' and commit the result."
            exit 1
          }
      - name: Search smoke test
        run: |
          python3 scripts/find.py 手绘 | grep -q Looseleaf
          python3 scripts/find.py glass mobile | grep -q ExpoKit
          python3 scripts/find.py 磁吸 | grep -q "Magnetic Button"

  links:
    if: github.event_name == 'workflow_dispatch' && inputs.links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check_links.py
